name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FocusTube_Native_APK_Project.zip -d proj
      - name: Fix Java target
        run: |
          cat >> proj/FocusTube/app/build.gradle <<'EOF'
          android {
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - run: gradle assembleDebug --no-daemon
        working-directory: proj/FocusTube
      - uses: actions/upload-artifact@v4
        with:
          name: FocusTube-apk
          path: proj/FocusTube/app/build/outputs/apk/debug/app-debug.apk
